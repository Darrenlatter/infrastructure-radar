<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Infrastructure Design Radar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    Infrastructure & Design Radar
                </h1>
                <p class="text-xs text-slate-400">Tracking issues, improvements, and updates across Cloud & Enterprise Stack</p>
            </div>
            <!-- Search Bar -->
            <div class="w-full sm:w-72">
                <input id="search-input" type="text" placeholder="Filter updates (e.g., vCenter, RHEL, IAM)..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Category Filter Tabs -->
        <div id="category-filters" class="flex flex-wrap gap-2 mb-8">
            <!-- Dynamically populated -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-sm text-slate-400">Aggregating live infrastructure engineering feeds...</p>
        </div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated cards -->
        </div>
    </main>

    <!-- Script Logic -->
    <script src="assets/app.js"></script>
</body>
</html>
